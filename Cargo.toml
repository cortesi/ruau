[workspace]
members = ["crates/ruau", "crates/ruau-syntax", "crates/ruau-bytecode", "crates/ruau-compile-fail", "crates/ruau-declaration", "crates/ruau-json-schema", "crates/ruau-derive", "crates/ruau-filesystem", "crates/ruau-session", "crates/ruau-executor", "crates/ruau-source", "crates/ruau-surface", "crates/ruau-typecheck", "crates/ruau-vm"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cortesi/ruau"
readme = "README.md"
keywords =  ["luau", "lua", "runtime", "parser", "typechecker"]

[workspace.dependencies]
blake3 = "1"
foldhash = "0.2"
pin-project-lite = "0.2"
proptest = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
proc-macro-crate = "3.5.0"
quote = "1"
rmp-serde = "1"
ruau = { path = "crates/ruau", version = "0.4.0" }
ruau-bytecode = { path = "crates/ruau-bytecode", version = "0.4.0" }
ruau-source = { path = "crates/ruau-source", version = "0.4.0" }
ruau-typecheck = { path = "crates/ruau-typecheck", version = "0.4.0" }
ruau-vm = { path = "crates/ruau-vm", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
stacker = "0.1"
strum = { version = "0.28", features = ["derive"] }
syn = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }
tokio-util = "0.7"
toml = "0.8"
trybuild = "1"
ruau-surface = { path = "crates/ruau-surface", version = "0.4.0" }
cap-std = "4"
same-file = "1"
thiserror = "2"
ruau-syntax = { path = "crates/ruau-syntax", version = "0.4.0" }
ruau-compile-fail = { path = "crates/ruau-compile-fail" }
ruau-declaration = { path = "crates/ruau-declaration", version = "0.4.0" }
ruau-json-schema = { path = "crates/ruau-json-schema", version = "0.4.0" }
ruau-derive = { path = "crates/ruau-derive", version = "0.4.0" }
ruau-filesystem = { path = "crates/ruau-filesystem", version = "0.4.0" }
ruau-session = { path = "crates/ruau-session", version = "0.4.0", default-features = false }
ruau-executor = { path = "crates/ruau-executor", version = "0.4.0" }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
missing_docs = "warn"
unnameable_types = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
branches_sharing_code = "warn"
ignore_without_reason = "warn"
let_underscore_must_use = "warn"
many_single_char_names = "warn"
multiple_inherent_impl = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
self_named_module_files = "warn"
tests_outside_test_module = "warn"
use_self = "warn"
wildcard_dependencies = "warn"
cfg_not_test = "warn"
comparison_chain = "warn"
items_after_statements = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"

# Settings with config values in clippy.toml. Keep the tidy gate focused on
# correctness-adjacent warnings rather than broad style/backlog sweeps.
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"
