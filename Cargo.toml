[workspace]
members = [
    "crates/ruau",
    "crates/ruau-abi",
    "crates/ruau-analysis",
    "crates/ruau-ast",
    "crates/ruau-bytecode",
    "crates/ruau-decl",
    "crates/ruau-embed-derive",
    "crates/ruau-source",
    "crates/ruau-typecheck",
    "crates/ruau-vm-api",
    "crates/ruau-vm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cortesi/ruau"
readme = "README.md"
keywords =  ["luau", "lua", "runtime", "parser", "typechecker"]

[workspace.dependencies]
blake3 = "1"
foldhash = "0.2"
pin-project-lite = "0.2"
proptest = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
proc-macro-crate = "3.5.0"
quote = "1"
rmp-serde = "1"
ruau = { path = "crates/ruau", version = "0.1.0" }
ruau-abi = { path = "crates/ruau-abi", version = "0.1.0" }
ruau-analysis = { path = "crates/ruau-analysis", version = "0.1.0" }
ruau-ast = { path = "crates/ruau-ast", version = "0.1.0" }
ruau-bytecode = { path = "crates/ruau-bytecode", version = "0.1.0" }
ruau-decl = { path = "crates/ruau-decl", version = "0.1.0" }
ruau-embed-derive = { path = "crates/ruau-embed-derive", version = "0.1.0" }
ruau-source = { path = "crates/ruau-source", version = "0.1.0" }
ruau-typecheck = { path = "crates/ruau-typecheck", version = "0.1.0" }
ruau-vm = { path = "crates/ruau-vm", version = "0.1.0" }
ruau-vm-api = { path = "crates/ruau-vm-api", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
stacker = "0.1"
strum = { version = "0.27", features = ["derive"] }
syn = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }
tokio-util = "0.7"
toml = "0.8"
trybuild = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
missing_docs = "warn"
unnameable_types = "warn"
