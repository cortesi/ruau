[package]
name = "ruau-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = false
keywords.workspace = true
description = "Retained source-eval host over a validated Ruau surface."

[lib]
path = "src/lib.rs"
test = false

[dependencies]
serde_json.workspace = true
ruau-bytecode.workspace = true
ruau-decl.workspace = true
ruau-source.workspace = true
ruau-surface.workspace = true
ruau-vm-api.workspace = true
ruau-vm.workspace = true
# `rt-multi-thread` supplies `block_in_place`, which the blocking eval
# entry points use when called from inside a multi-thread runtime context.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
