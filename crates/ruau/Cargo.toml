[package]
name = "ruau"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Pure Rust implementation of Luau and its analyzer."

[lib]
doctest = false
test = false

[dependencies]
ruau-syntax.workspace = true
ruau-bytecode.workspace = true
ruau-declaration.workspace = true
ruau-json-schema.workspace = true
ruau-source.workspace = true
ruau-surface.workspace = true
ruau-typecheck.workspace = true
ruau-vm.workspace = true
serde_json = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruau-session = { workspace = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ruau-filesystem.workspace = true
ruau-executor.workspace = true
ruau-session = { workspace = true, default-features = false, features = ["eval"] }

[features]
default = []
# `#[derive(IntoLua, FromLua)]` for embedding hosts' plain structs.
derive = ["ruau-vm/derive"]
# Validated `.d.luau` declaration inspection.
declaration-parse = ["ruau-declaration/parse"]
# Ready-made native JSON module and declaration.
json-module = ["dep:serde_json"]

[dev-dependencies]
# Self dev-dependency: turns optional derive support on for this crate's own
# unit and integration tests, so plain workspace test runs cover it.
ruau = { path = ".", features = ["derive", "json-module"], default-features = false }
ruau-vm = { workspace = true, features = ["conformance"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }

[lints]
workspace = true
