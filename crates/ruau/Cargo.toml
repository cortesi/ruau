[package]
name = "ruau"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Pure Rust implementation of Luau and its analyzer."

[lib]
path = "src/lib.rs"
test = false

[dependencies]
ruau-analysis.workspace = true
ruau-ast.workspace = true
ruau-bytecode.workspace = true
ruau-decl.workspace = true
ruau-fs.workspace = true
ruau-host.workspace = true
ruau-source.workspace = true
ruau-surface.workspace = true
ruau-typecheck.workspace = true
ruau-vm-api.workspace = true
ruau-vm.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ruau-runner.workspace = true

[features]
default = []
# `#[derive(IntoLua, FromLua)]` for embedding hosts' plain structs.
derive = ["ruau-vm/derive"]

[dev-dependencies]
# Self dev-dependency: turns optional derive support on for this crate's own
# unit and integration tests, so plain workspace test runs cover it.
ruau = { path = ".", features = ["derive"], default-features = false }
ruau-vm = { workspace = true, features = ["conformance"] }
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }

[lints]
workspace = true
