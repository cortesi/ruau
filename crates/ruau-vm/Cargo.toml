[package]
name = "ruau-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = false
keywords.workspace = true
description = "The Ruau VM: a pure-Rust, async, sandboxed executor for Luau bytecode."

[lib]
path = "src/lib.rs"
doctest = false
test = false

[features]
default = []
conformance = []
derive = ["dep:ruau-derive"]

[dependencies]
blake3.workspace = true
foldhash.workspace = true
pin-project-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
ruau-declaration.workspace = true
ruau-bytecode.workspace = true
ruau-source.workspace = true
ruau-syntax.workspace = true
rmp-serde.workspace = true
ruau-derive = { workspace = true, optional = true }
stacker.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
proptest.workspace = true
ruau-compile-fail.workspace = true

[lints]
workspace = true
