[package]
name = "ruau-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = false
keywords.workspace = true
description = "The Ruau VM: a pure-Rust, async, sandboxed executor for Luau bytecode."

[lib]
path = "src/lib.rs"
test = false

[features]
default = []
conformance = []
derive = ["dep:ruau-embed-derive"]
serde = ["dep:serde_json"]

[dependencies]
blake3.workspace = true
foldhash.workspace = true
pin-project-lite.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
ruau-abi.workspace = true
ruau-vm-api.workspace = true
ruau-decl.workspace = true
ruau-bytecode.workspace = true
ruau-source.workspace = true
rmp-serde.workspace = true
ruau-embed-derive = { workspace = true, optional = true }
stacker.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
proptest.workspace = true
trybuild.workspace = true

[lints]
workspace = true
